<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Редактор Scratch: блоки, спрайты, сцена, костюмы и звуки. Проекты .sb3 открываются и сохраняются на компьютер, автосохранение в браузере. Без Roblox и Arduino.">
  <meta name="google" content="notranslate">
  <title>Scratch Code — программирование блоками</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234c97ff'/%3E%3Ctext x='32' y='42' font-size='34' text-anchor='middle' fill='white' font-family='Arial'%3ES%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Scratch Code">
      <span class="brand-mark">S</span>
      <span class="brand-name">Scratch Code</span>
    </a>
    <span class="badge">только Scratch</span>
    <span class="spacer"></span>
    <span id="save-status" class="save-status" role="status">Загрузка редактора…</span>
    <button id="download-btn" class="btn" type="button" title="Сохранить .sb3 на компьютер">Скачать .sb3</button>
  </header>

  <main id="app" class="app" translate="no">
    <div class="loading-screen">
      <div class="spinner" aria-hidden="true"></div>
      <p>Загрузка Scratch…</p>
      <p class="loading-note">Первый запуск может занять несколько секунд.</p>
    </div>
    <noscript><p class="noscript">Для редактора Scratch нужен JavaScript.</p></noscript>
  </main>

  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script>window.react = window.React; window['react-dom'] = window.ReactDOM;</script>
  <script src="vendor/scratch-gui/dist/scratch-gui.js"></script>
  <script src="app.js"></script>
</body>
</html>
